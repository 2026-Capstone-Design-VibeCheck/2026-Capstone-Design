<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explainable IDOR Analyzer</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Explainable IDOR Analyzer</h1><p class="sub">OpenAPI와 선택적 소스 코드·이벤트 로그를 이용해 이해 가능한 IDOR 후보를 생성합니다.</p><section class="card"><form id="f"><label>OpenAPI 파일 <input name="openapi" type="file" accept=".yaml,.yml,.json"></label><label>또는 OpenAPI URL <input name="openapi_url" placeholder="https://example.com/openapi.yaml"></label><label>소스 코드 ZIP(선택) <input name="source_zip" type="file" accept=".zip"></label><label>이벤트 로그(선택) <input name="event_log" type="file"></label><label>Links2CPN 저장소 경로(이벤트 로그 사용 시) <input name="links2cpn_repo" placeholder="C:\\...\\openapi-links-to-CPNs"></label><button>분석 시작</button></form><p id="status"></p></section><section id="out"></section></main><script src="/static/app.js"></script></body></html>
